environment_vars:
  FRIGATE_MQTT_USER: ""
  FRIGATE_MQTT_PASSWORD: ""
  FRIGATE_RTSP_USER: ""
  FRIGATE_RTSP_PASSWORD: ""
  FRIGATE_RTSP_EUFY_USER: ""
  FRIGATE_RTSP_EUFY_PASSWORD: ""

mqtt:
  enabled: true
  host: 192.168.4.103
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

objects:
  track:
    - person
    - car
    - bicycle
    - motorcycle

record:
  enabled: true

  motion:
    days: 7

  alerts:
    retain:
      days: 30
      mode: motion

  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 30

go2rtc:
  streams:
    side_cam: 
      - rtsp://192.168.4.38/ch0_1.h264

cameras:
  front_camera:
    enabled: true
    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_RTSP_EUFY_USER}:{FRIGATE_RTSP_EUFY_PASSWORD}@192.168.4.105/live0
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      threshold: 35
      contour_area: 20
      improve_contrast: true
      mask:
        - 0,0.513,0,0.198,0,0,0.935,0.006,0.967,0.213,0.8,0.347,0.666,0.371,0.407,0.27,0.409,0.455,0.233,0.469,0.163,0.297,0.014,0.368,0.01,0.516
        - 0.599,0.524,0.635,0.486,0.667,0.509,0.665,0.585,0.614,0.592
        - 0.92,0.267,0.941,0.328,0.858,0.4,0.838,0.335
        - 0.001,0.886,0,1,0.178,0.996,0.029,0.907
        - 0.796,1,0.996,1,1,0.869
    objects:
      track:
        - person
        - car
        - bicycle
        - motorcycle

      filters:
        person:
          min_area: 3000
          min_score: 0.6
        car:
          min_area: 4500
          min_score: 0.6
        bicycle:
          min_area: 3000
          min_score: 0.6
        motorcycle:
          min_area: 3000
          min_score: 0.6

    zones:
      driveway:
        coordinates: 
          0,0.377,0.159,0.301,0.265,0.276,0.367,0.234,0.519,0.202,0.679,0.242,0.811,0.266,1,0.198,0.979,0.909,0.778,0.72,0.571,0.775,0.01,0.802
        loitering_time: 10
        objects:
          - car
          - motorcycle
          - bicycle
        inertia: 3
      front_person:
        coordinates: 
          0.374,0.486,0.381,0.92,0.765,0.825,0.776,0.436,1,0.373,0.986,0.87,0.791,1,0.388,1,0.194,1,0,0.89,0,0.514
        loitering_time: 9
        objects: person
        inertia: 3
    review:
      alerts:
        required_zones:
          - driveway
          - front_person
      detections: {}

  fdoor_camera:
    enabled: true
    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.4.35:554/stream1?video&audio
          roles:
            - record
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.4.35:554/stream1
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      threshold: 30
      contour_area: 20
      improve_contrast: true
      mask: 0.112,0.67,0.085,0.544,0.094,0.428,0.142,0.456,0.16,0.56,0.163,0.636
    objects:
      track:
        - person
        - dog
        - cat

      filters:
        person:
          mask: 
            0.588,0,0.583,0.228,0.752,0.24,0.771,0.036,0.962,0.054,0.919,0.286,0.963,0.299,1,0.315,1,0,0.865,0

  side_camera:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/side_cam
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      threshold: 30
      contour_area: 20
      improve_contrast: true
    objects:
      track:
        - person
        - dog
        - cat

      filters:
        person:
          mask: 0.286,0.19,0.329,0.189,0.329,0.457,0.285,0.451

  yard_cam:
    enabled: true

    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.4.34:554/stream1
          roles:
            - record
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.4.34:554/stream2
          roles:
            - detect

    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      threshold: 30
      contour_area: 20
      improve_contrast: true
      mask: 
        0,0.002,0.001,0.33,0.349,0.234,0.451,0.148,0.465,0.03,0.599,0.032,0.606,0.126,0.647,0.192,0.7,0.252,0.761,0.246,0.995,0.328,0.997,0.008
    objects:
      track:
        - person
        - dog
        - cat

version: 0.17-0
