# Board: ESP32-S3 DevKitC-1 (Espressif)
#
# --- Casablanca 99019 (FCC ID: IN2TX35, 434MHz) ---
# Captured & decoded from real remote. 44-bit address confirmed identical
# across ALL 8 buttons tested; only the last 21 bits (command field) differ.
#
# CONFIRMED REAL BEHAVIOR (from on-fan testing):
#   - Speed 1-4 buttons: set fan speed directly. Works perfectly.
#   - Power button: NOT a toggle — it just forces fan speed to 0 (off).
#   - Up/Down buttons actually control the LIGHT, not fan speed:
#       * short tap of EITHER button -> toggles light on/off (same result either way) — WORKS
#       * held Up/Down -> intended to brighten/dim the light, but replaying
#         the captured hold sequence produced no effect on the real fan.
#         Since the RF link is one-way (no brightness feedback to HA either
#         way), hold-to-dim was dropped from this config — only the on/off
#         toggle is exposed. Use the physical remote for brightness.
#
# --- Minka-Aire UC7084T (FCC ID: CHQ7084T, 303.82MHz) ---
# CONFIRMED WORKING on the real fan with raw pulse arrays (switched from
# the rc_switch-protocol shorthand, transmit_rc_switch_raw, which produced
# no response even with output-power/settle-delay workarounds — the bug was
# in that action/encoding path, not in frequency switching). First 6 bits
# (100000) are a fixed address shared by every button, confirmed via native
# rc_switch decode on the receive side.
#
# --- Multi-frequency note ---
# One CC1101 now serves both fans on different frequencies, so every button
# calls cc1101.set_frequency immediately before transmitting (434MHz for
# Casablanca, 303.82MHz for Minka-Aire) rather than relying on the cc1101:
# block's static default.
#
# --- Minka-Aire DL-4510 (FCC ID: Y7ZDL4510T, 314.926MHz) ---
# CONFIRMED WORKING with raw pulse arrays. FCC-listed 314.9MHz did not
# receive; the precise FCC-report frequency 314.926MHz does.
#


esphome:
  name: fan-rf-hub

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "fan-rf-hub Fallback Hotspot"
    password: "uwUcXJgCvRxg"

captive_portal:

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

cc1101:
  id: cc1101_radio
  cs_pin: GPIO10
  frequency: 433.92MHz
  modulation_type: ASK/OOK

remote_transmitter:
  id: rf_tx
  pin: GPIO4      # GDO0
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  pin: GPIO5      # GDO2
  dump:
    - raw
    - rc_switch
  tolerance: 50%
  filter: 100us
  idle: 10ms

# ---------------------------------------------------------------------------
# button: discrete one-shot actions (speed select, fan off, light toggle)
# Note: Up/Down "hold to dim" was tried via a switch + while-loop that kept
# re-sending the tap code, but it produced no effect on the real fan, and
# even if it had worked there'd be no way to know the light's brightness
# state from HA anyway (RF remote is one-way, no feedback). So HA only
# exposes the light toggle (short tap) — brightness is left to the physical
# remote.
